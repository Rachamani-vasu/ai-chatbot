<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="32J3_ChatBot - AI Student Assistant">

    <title>32J3_ChatBot</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-header">

                <div class="brand">

                    <div class="brand-icon">
                        ✨
                    </div>

                    <div>
                        <h2>32J3_ChatBot</h2>
                        <span>AI Student Assistant</span>
                    </div>

                </div>

                <button
                    class="close-sidebar"
                    onclick="toggleSidebar()">
                    ×
                </button>

            </div>


            <!-- NEW CHAT -->

            <button
                class="new-chat"
                onclick="newChat()">

                <span>＋</span>
                <span>New Chat</span>

            </button>


            <!-- SEARCH -->

            <div class="search-box">

                <span>🔍</span>

                <input
                    type="text"
                    id="searchChats"
                    placeholder="Search chats...">

            </div>


            <!-- CHAT HISTORY -->

            <div class="chat-history">

                <div class="history-title">
                    TODAY
                </div>

                <div id="chatHistory"></div>

            </div>


            <!-- SIDEBAR BUTTONS -->

            <div class="sidebar-bottom">

                <button
                    class="sidebar-button"
                    onclick="toggleTheme()">

                    <span id="themeIcon">
                        🌙
                    </span>

                    <span>
                        Dark Mode
                    </span>

                </button>


                <button
                    class="sidebar-button"
                    onclick="clearAllChats()">

                    🗑️

                    <span>
                        Clear History
                    </span>

                </button>

            </div>

        </aside>


        <!-- MAIN -->

        <main class="main">


            <!-- TOP BAR -->

            <header class="topbar">

                <button
                    class="menu-button"
                    onclick="toggleSidebar()">

                    ☰

                </button>


                <div class="topbar-title">

                    <div class="status-dot"></div>

                    <div>

                        <strong>
                            32J3_ChatBot
                        </strong>

                        <small>
                            AI Student Assistant
                        </small>

                    </div>

                </div>


                <div class="topbar-actions">

                    <button
                        onclick="newChat()"
                        title="New Chat">

                        ＋

                    </button>


                    <button
                        onclick="toggleTheme()"
                        id="topThemeButton"
                        title="Change theme">

                        🌙

                    </button>

                </div>

            </header>


            <!-- CHAT AREA -->

            <section
                class="chat-area"
                id="chatArea">


                <!-- WELCOME -->

                <div
                    class="welcome"
                    id="welcomeScreen">

                    <div class="welcome-logo">
                        ✨
                    </div>

                    <h1>
                        How can I help you today?
                    </h1>

                    <p>
                        Welcome to 32J3_ChatBot.
                        Ask questions about programming,
                        academics, exams, projects and more.
                    </p>


                    <!-- SUGGESTIONS -->

                    <div class="suggestions">


                        <button
                            onclick="useSuggestion('Explain Python in simple words')">

                            <span>🐍</span>

                            <div>

                                <strong>
                                    Learn Python
                                </strong>

                                <small>
                                    Explain Python in simple words
                                </small>

                            </div>

                        </button>


                        <button
                            onclick="useSuggestion('Explain machine learning with a simple example')">

                            <span>🧠</span>

                            <div>

                                <strong>
                                    Machine Learning
                                </strong>

                                <small>
                                    Explain ML with an example
                                </small>

                            </div>

                        </button>


                        <button
                            onclick="useSuggestion('Give me important exam questions for Software Engineering')">

                            <span>📚</span>

                            <div>

                                <strong>
                                    Exam Preparation
                                </strong>

                                <small>
                                    Get important exam questions
                                </small>

                            </div>

                        </button>


                        <button
                            onclick="useSuggestion('Help me create a web development project')">

                            <span>💻</span>

                            <div>

                                <strong>
                                    Project Help
                                </strong>

                                <small>
                                    Get help with your project
                                </small>

                            </div>

                        </button>


                    </div>

                </div>


                <!-- MESSAGES -->

                <div
                    id="messages"
                    class="messages">

                </div>

            </section>


            <!-- INPUT -->

            <div class="input-section">

                <div class="input-wrapper">


                    <!-- VOICE -->

                    <button
                        class="input-action"
                        id="voiceButton"
                        onclick="startVoiceInput()"
                        title="Voice input">

                        🎤

                    </button>


                    <!-- TEXT -->

                    <textarea
                        id="userInput"
                        rows="1"
                        placeholder="Message 32J3_ChatBot..."
                        onkeydown="handleKey(event)"
                        oninput="autoResize(this)"></textarea>


                    <!-- SEND -->

                    <button
                        class="send-button"
                        id="sendButton"
                        onclick="sendMessage()"
                        title="Send message">

                        ➤

                    </button>

                </div>


                <div class="input-info">

                    <span>
                        32J3_ChatBot can make mistakes.
                        Check important information.
                    </span>

                    <span>
                        Press Enter to send
                    </span>

                </div>

            </div>

        </main>

    </div>


    <!-- MOBILE OVERLAY -->

    <div
        class="overlay"
        id="overlay"
        onclick="toggleSidebar()">
    </div>


    <script src="script.js"></script>

</body>

</html>
